<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de IMC</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="imc.css">
<link rel="icon" href="imc.png">


</head>
<body>

<div class="caixa-central">

  <div class="titulo">
    <h1>IMC</h1>
    <p>Calculadora de Índice de Massa Corporal</p>
    <p class="explicacao">
      Sabe aquela balança que você evita subir? 
      O IMC é a versão matemática dela. 
      Coloca seu peso e sua altura e a gente 
      te conta a verdade que você tava fugindo. 
      Com amor, claro. 
      
    </p>
  </div>

  <div class="cartao">

    <div class="campo">
      <label>Seu nome</label>
      <input type="text" id="entrada-nome" placeholder="Qual é seu nome?" >
    </div>

    <div class="dois-campos">

      <div class="campo">
        <label>Peso (kg)</label>
        <input type="number" id="entrada-peso" placeholder="70" >
      </div>

      <div class="campo">
        <label>Altura (m)</label>
        <input type="number" id="entrada-altura" placeholder="1.75">
      </div>

    </div>

    <button class="botao-calcular" onclick="calcular()">
      CALCULAR
    </button>

    <div class="resultado" id="caixa-resultado">
      <span class="emoji-resultado" id="emoji"></span>

      <div class="numero-imc" id="numero-imc"></div>

      <div class="texto-imc">Seu IMC</div>

      <div class="categoria" id="categoria"></div>

      <div class="mensagem" id="mensagem"></div>
    </div>

  </div>

</div>

<footer class="Dev">
<p>Desenvolvido por Erasmo Fernandes</p>
<a href="https://www.linkedin.com/in/erasmo-carlos-junior-fernandes-3657013b0/" target="_blank">LinkedIn</a>

</footer>

<script src="script.js"></script>

</body>
</html>
